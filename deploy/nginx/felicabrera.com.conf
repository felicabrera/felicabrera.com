# felicabrera.com and www.felicabrera.com: the personal site + blog.
# www redirects to the apex, which is canonical.
#
# Topology: Cloudflare proxies the zone and forwards to the host's public
# origin, which NATs to this nginx on the WAF (eugene-waf). nginx proxies to
# the felicabrera-web container on the LAN at 10.10.10.20:21200 (Next.js
# standalone server). TLS is the Cloudflare Origin CA wildcard
# (*.felicabrera.com, felicabrera.com), trusted only by Cloudflare's edge, so
# Cloudflare must stay proxied with SSL mode Full (strict).
#
# This file is the source of truth. The Deploy workflow copies it to the host,
# installs it at /etc/nginx/sites-available/felicabrera.com.conf, symlinks it
# into sites-enabled, runs `nginx -t`, and reloads nginx only when that passes.
# Change the vhost here, not on the host.

server {
    listen 80;
    listen [::]:80;
    server_name felicabrera.com www.felicabrera.com;

    return 301 https://felicabrera.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.felicabrera.com;

    ssl_certificate     /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.pem;
    ssl_certificate_key /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://felicabrera.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name felicabrera.com;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    ssl_certificate     /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.pem;
    ssl_certificate_key /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trust Cloudflare's edge for the visitor's real address.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    server_tokens off;

    # Next.js build assets are content-hashed and immutable.
    location /_next/static/ {
        proxy_pass         http://10.10.10.20:21200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_valid  200 60m;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://10.10.10.20:21200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        client_max_body_size 2m;
    }

    access_log /var/log/nginx/felicabrera.com.access.log;
    error_log  /var/log/nginx/felicabrera.com.error.log warn;
}
